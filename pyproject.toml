[project]
name = "rasterezpl"
version = "0.23.0"
description = "Print any bitmap to Godex-language (EZPL) thermal label printers — Godex, Panduit TDP series — from macOS, Linux or Windows, no driver"
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.11"
authors = [{ name = "Chengqi Luo" }]
keywords = ["ezpl", "godex", "panduit", "tdp43me", "label printer", "thermal", "raster", "macos", "windows", "usb", "cups"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "Intended Audience :: System Administrators",
    "License :: OSI Approved :: MIT License",
    "Operating System :: MacOS",
    "Operating System :: Microsoft :: Windows",
    "Operating System :: POSIX :: Linux",
    "Programming Language :: Python :: 3",
    "Topic :: Printing",
]
dependencies = [
    "pillow>=10",
    "pyyaml>=6.0",
    "segno>=1.6",
]

[project.optional-dependencies]
svg = ["cairosvg>=2.7"]  # SVG pictures on labels (or install librsvg for rsvg-convert)
usb = ["pyusb>=1.2"]  # `--to usb:` — writes to the USB printer-class device itself (macOS 26 has no raw CUPS queues)
windows = ["pywin32>=306; sys_platform == 'win32'"]  # `--to win:<queue>` — RAW through the Windows spooler (no WinUSB swap needed)
xlsx = ["openpyxl>=3.1"]  # `import FILE.ezpx --data rows.xlsx` — the workbook a GoLabel design binds to (CSV needs nothing)
build = ["pyinstaller>=6.0"]  # the one-folder executable (packaging/rasterezpl.spec, the release workflow)
dev = [
    "pytest>=8.0",
    "pytest-github-actions-annotate-failures>=0.2",  # a failing test on CI becomes an annotation on the run (file, line, message) — readable without the job log
    "ruff>=0.4",
    "mypy>=1.8",
    "types-PyYAML",
    "zxing-cpp>=2.2",  # the barcode round-trip test
    "openpyxl>=3.1",  # the importer's .xlsx test
]

[project.scripts]
rasterezpl = "rasterezpl.cli:main"

[project.urls]
Homepage = "https://github.com/cluo86/rasterezpl"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/rasterezpl"]

[tool.ruff]
line-length = 110
target-version = "py311"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
ignore = ["E501"]  # the formatter wraps code; docstrings and messages may run long

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.mypy]
python_version = "3.11"
ignore_missing_imports = true
