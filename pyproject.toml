[project]
name = "rasterezpl"
version = "0.8.1"
description = "Print any bitmap to Godex-language (EZPL) thermal label printers — Godex, Panduit TDP series — from macOS or Linux, no driver"
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.11"
authors = [{ name = "Chengqi Luo" }]
keywords = ["ezpl", "godex", "panduit", "tdp43me", "label printer", "thermal", "raster", "macos", "usb", "cups"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "Intended Audience :: System Administrators",
    "License :: OSI Approved :: MIT License",
    "Operating System :: MacOS",
    "Operating System :: POSIX :: Linux",
    "Programming Language :: Python :: 3",
    "Topic :: Printing",
]
dependencies = [
    "pillow>=10",
    "pyyaml>=6.0",
    "segno>=1.6",
]

[project.optional-dependencies]
svg = ["cairosvg>=2.7"]  # SVG pictures on labels (or install librsvg for rsvg-convert)
usb = ["pyusb>=1.2"]  # `--to usb:` — writes to the USB printer-class device itself (macOS 26 has no raw CUPS queues)
dev = ["pytest>=8.0", "ruff>=0.4", "mypy>=1.8", "types-PyYAML"]

[project.scripts]
rasterezpl = "rasterezpl.cli:main"

[project.urls]
Homepage = "https://github.com/cluo86/rasterezpl"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/rasterezpl"]

[tool.ruff]
line-length = 110
target-version = "py311"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
ignore = ["E501"]  # the formatter wraps code; docstrings and messages may run long

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.mypy]
python_version = "3.11"
ignore_missing_imports = true
